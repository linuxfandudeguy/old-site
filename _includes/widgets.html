  <script>
  (function(){
    const windows = Array.from(document.querySelectorAll('.window'));
    let topZ = 1000;
    const marginSide = 20;
    const marginTop = 20;
    const gap = 20;

    // dock windows to the left stacked vertically
    windows.forEach((win, i) => {
      const top = marginTop + i * (win.getBoundingClientRect().height + gap);
      win.style.left = marginSide + 'px';
      win.style.top  = top + 'px';
      win.style.zIndex = ++topZ;
    });

    windows.forEach(win => {
      const handle = win.querySelector('[data-drag-handle]') || win;

      // dragging logic
      let dragging = false, offsetX = 0, offsetY = 0;

      handle.addEventListener('pointerdown', e => {
        if(e.button !== 0) return;
        dragging = true;
        offsetX = e.clientX - win.offsetLeft;
        offsetY = e.clientY - win.offsetTop;
        win.classList.add('dragging');
        win.style.zIndex = ++topZ;
        handle.setPointerCapture(e.pointerId);
      });

      handle.addEventListener('pointermove', e => {
        if(!dragging) return;
        const left = e.clientX - offsetX;
        const top  = e.clientY - offsetY;
        setPositionWithinViewport(win, left, top);
      });

      handle.addEventListener('pointerup', e => {
        dragging = false;
        win.classList.remove('dragging');
        handle.releasePointerCapture(e.pointerId);
      });
      handle.addEventListener('pointercancel', () => { dragging=false; win.classList.remove('dragging'); });

      // keyboard nudge
      win.addEventListener('keydown', e => {
        const step = e.shiftKey ? 20 : 5;
        let moved = false;
        const rect = win.getBoundingClientRect();
        let left = rect.left, top = rect.top;

        if(e.key==='ArrowLeft'){ left -= step; moved=true; }
        if(e.key==='ArrowRight'){ left += step; moved=true; }
        if(e.key==='ArrowUp'){ top -= step; moved=true; }
        if(e.key==='ArrowDown'){ top += step; moved=true; }

        if(moved){ e.preventDefault(); setPositionWithinViewport(win,left,top); }
      });
    });

    function setPositionWithinViewport(win, left, top){
      const rect = win.getBoundingClientRect();
      const w = rect.width, h = rect.height;
      const maxLeft = Math.max(window.innerWidth - w - 8, 8);
      const maxTop  = Math.max(window.innerHeight - h - 8, 8);

      left = Math.max(8, Math.min(left, maxLeft));
      top  = Math.max(8, Math.min(top, maxTop));

      win.style.left = left + 'px';
      win.style.top  = top  + 'px';
    }
  })();
  </script>
